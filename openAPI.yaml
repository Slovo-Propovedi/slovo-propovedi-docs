openapi: 3.0.0
info:
  title: Admin API — Слово.Проповеди
  version: 1.0.0
  description: |
    REST API для административной панели проекта "Слово.Проповеди".
    Позволяет управлять проповедями, плейлистами, разделами, загружать файлы и работать с пользователями.
servers:
  - url: http://localhost:3000
    description: Локальный сервер разработки
  - url: https://api.slovo-propovedi.ru
    description: Продакшн сервер
tags:
  - name: Auth
    description: Аутентификация администраторов
  - name: Files
    description: Загрузка и получение файлов через MinIO
  - name: Sermons
    description: Управление проповедями
  - name: Sections
    description: Управление разделами
  - name: Playlists
    description: Управление плейлистами
paths:
  /files:
    post:
      operationId: AppController_uploadFile
      summary: Загрузить файл (аудио, видео, изображение и др.)
      description: Файл сохраняется в MinIO
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IFileResponseDto'
      tags:
        - Files
      security:
        - bearer: []
  /files/{fileName}/stream-url:
    get:
      operationId: AppController_getStreamUrl
      summary: Получить URL потока для файла
      parameters:
        - name: fileName
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: 'Предварительно подписанный URL потока'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamUrlResponse'
      tags:
        - Files
  /files/{fileName}:
    get:
      operationId: AppController_getFile
      summary: Получить публичный URL файла
      parameters:
        - name: fileName
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Информация о файле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IFileResponseDto'
      tags:
        - Files
  /health:
    get:
      operationId: HealthController_check
      summary: Проверить состояние сервиса
      parameters: []
      responses:
        '200':
          description: 'Состояние сервиса'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /section:
    post:
      operationId: SectionController_create
      summary: Создать раздел
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionDto'
      responses:
        '200':
          description: Раздел создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
    get:
      operationId: SectionController_findAll
      summary: Получить все разделы
      parameters: []
      responses:
        '200':
          description: Список разделов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSectionsResponse'
      tags:
        - Sections
  /section/{id}:
    get:
      operationId: SectionController_findOne
      summary: Получить раздел по ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Раздел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
    patch:
      operationId: SectionController_update
      summary: Обновить раздел (включая связанные плейлисты)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionDto'
      responses:
        '200':
          description: Раздел обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
    delete:
      operationId: SectionController_remove
      summary: Удалить раздел
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Раздел удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSectionsResponse'
      tags:
        - Sections
  /playlists:
    post:
      operationId: PlaylistController_create
      summary: Создать плейлист
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistDto'
      responses:
        '200':
          description: Плейлист создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
    get:
      operationId: PlaylistController_findAll
      summary: Получить все плейлисты
      parameters: []
      responses:
        '200':
          description: Список плейлистов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllPlaylistsResponse'
      tags:
        - Playlists
  /playlists/{id}:
    get:
      operationId: PlaylistController_findOne
      summary: Получить плейлист по ID (с проповедями)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Плейлист
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
    patch:
      operationId: PlaylistController_update
      summary: Обновить плейлист
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistDto'
      responses:
        '200':
          description: Плейлист обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
    delete:
      operationId: PlaylistController_remove
      summary: Удалить плейлист
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Плейлист удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPlaylistResponse'
      tags:
        - Playlists
  /sermons:
    post:
      operationId: SermonController_create
      summary: Создать новую проповедь
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSermonDto'
      responses:
        '200':
          description: Проповедь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermonEntity'
      tags:
        - Sermons
    get:
      operationId: SermonController_findAll
      summary: Получить список всех проповедей
      parameters:
        - name: take
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          required: false
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список проповедей с количеством
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSermonsResponse'
      tags:
        - Sermons
  /sermons/{id}/stream-url:
    get:
      operationId: SermonController_getStreamUrl
      summary: Получить URL потока для аудио проповеди
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Предварительно подписанный URL потока'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamUrlResponse'
      tags:
        - Sermons
      security:
        - bearer: []
  /sermons/{id}:
    get:
      operationId: SermonController_findOne
      summary: Получить одну проповедь по ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Проповедь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermonEntity'
      tags:
        - Sermons
    patch:
      operationId: SermonController_update
      summary: Обновить проповедь
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSermonDto'
      responses:
        '200':
          description: Проповедь обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSermonResponse'
      tags:
        - Sermons
    delete:
      operationId: SermonController_remove
      summary: Удалить проповедь
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Проповедь удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSermonResponse'
      tags:
        - Sermons
  /auth/login:
    post:
      operationId: AuthController_signIn
      summary: Вход в админ-панель
      description: Возвращает JWT токен для дальнейших запросов
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequestDto'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Обновить access и refresh токены
      description: Принимает refresh токен и возвращает новую пару токенов
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
      tags:
        - Auth
  /auth/profile:
    get:
      operationId: AuthController_getProfile
      summary: Получить профиль текущего пользователя
      parameters: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      tags:
        - Auth
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT токен, полученный после успешного логина
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    StreamUrlResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url
    IFileResponseDto:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
        fileUrl:
          type: string
      required:
        - fileName
        - fileUrl
    CreateSectionDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        itemsSize:
          type: string
          enum:
            - small
            - middle
            - large
            - xLarge
        itemsRows:
          type: number
        transform:
          type: string
          enum:
            - high
            - short
        isDescriptionTitleOnSlideLarge:
          type: boolean
        whereIsSlideTitleLocated:
          type: string
          enum:
            - 'on'
            - under
            - bothOnAndUnder
        borderRadius:
          type: boolean
      required:
        - title
        - itemsSize
        - transform
    SectionEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        itemsSize:
          type: string
          enum:
            - small
            - middle
            - large
            - xLarge
        itemsRows:
          type: number
          nullable: true
        transform:
          type: string
          enum:
            - high
            - short
        isDescriptionTitleOnSlideLarge:
          type: boolean
          default: false
        whereIsSlideTitleLocated:
          type: string
          enum:
            - 'on'
            - under
            - bothOnAndUnder
          default: under
        borderRadius:
          type: boolean
          default: false
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistEntity'
      required:
        - id
        - title
        - itemsSize
        - transform
        - playlists
    SermonEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        textFileUrl:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        youtubeUrl:
          type: string
          nullable: true
        artist:
          type: string
        artwork:
          type: string
        book:
          type: string
          nullable: true
        chapter:
          type: number
          nullable: true
        verse:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
          nullable: true
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistEntity'
      required:
        - id
        - title
        - description
        - textFileUrl
        - audioUrl
        - youtubeUrl
        - artist
        - artwork
        - book
        - chapter
        - verse
        - playlists
    PlaylistEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        artwork:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionEntity'
        sermons:
          type: array
          items:
            $ref: '#/components/schemas/SermonEntity'
      required:
        - id
        - title
        - description
        - artwork
        - sections
        - sermons
    AllSectionsResponse:
      type: object
      additionalProperties: false
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionEntity'
        count:
          type: number
      required:
        - sections
        - count
    UpdateSectionDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        playlistsIds:
          type: array
          items:
            type: string
        itemsSize:
          type: string
          enum:
            - small
            - middle
            - large
            - xLarge
        itemsRows:
          type: number
        transform:
          type: string
          enum:
            - high
            - short
        isDescriptionTitleOnSlideLarge:
          type: boolean
        whereIsSlideTitleLocated:
          type: string
          enum:
            - 'on'
            - under
            - bothOnAndUnder
        borderRadius:
          type: boolean
    StatusSectionsResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    CreatePlaylistDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        artwork:
          type: string
        sermonsIds:
          type: array
          items:
            type: string
      required:
        - title
        - description
        - artwork
    AllPlaylistsResponse:
      type: object
      additionalProperties: false
      properties:
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistEntity'
        count:
          type: number
      required:
        - playlists
        - count
    UpdatePlaylistDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        artwork:
          type: string
        sermonsIds:
          type: array
          items:
            type: string
        sectionsIds:
          type: array
          items:
            type: string
    StatusPlaylistResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    CreateSermonDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        textFileUrl:
          type: string
        audioUrl:
          type: string
        youtubeUrl:
          type: string
        artist:
          type: string
        artwork:
          type: string
        book:
          type: string
          nullable: true
          example: Genesis
        chapter:
          type: number
        verse:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
        playlistsIds:
          type: array
          items:
            type: string
      required:
        - title
        - description
        - artist
        - artwork
    AllSermonsResponse:
      type: object
      additionalProperties: false
      properties:
        sermons:
          type: array
          items:
            $ref: '#/components/schemas/SermonEntity'
        count:
          type: number
          nullable: true
        nextCursor:
          type: string
          nullable: true
      required:
        - sermons
        - count
        - nextCursor
    UpdateSermonDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        textFileUrl:
          type: string
        audioUrl:
          type: string
        youtubeUrl:
          type: string
        artist:
          type: string
        artwork:
          type: string
        book:
          type: string
          nullable: true
          example: Genesis
        chapter:
          type: number
        verse:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
        playlistsIds:
          type: array
          items:
            type: string
    StatusSermonResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    SignInRequestDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    UserResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email
    AuthResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - accessToken
        - refreshToken
        - user
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    RefreshResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
