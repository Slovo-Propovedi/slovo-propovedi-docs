openapi: 3.0.3
info:
  title: Admin API — Слово.Проповеди
  version: 0.6.0
  description: |
    REST API для административной панели проекта "Слово.Проповеди".
    Позволяет управлять проповедями, плейлистами, разделами, загружать файлы и работать с пользователями.
servers:
  - url: http://localhost:3000
    description: Локальный сервер разработки
  - url: https://api.slovo-propovedi.ru
    description: Продакшн сервер
tags:
  - name: Auth
    description: Аутентификация администраторов
  - name: Files
    description: Загрузка и получение файлов через MinIO
  - name: Sermons
    description: Управление проповедями
  - name: Sections
    description: Управление разделами
  - name: Playlists
    description: Управление плейлистами
  - name: Users
    description: Управление пользователями (админами)
paths:
  /files:
    post:
      operationId: AppController_uploadFile
      summary: "Загрузить файл (изображение, аудио MP3, PDF, FB2)"
      description: "Файл сохраняется в MinIO. Допустимые форматы: JPEG, PNG, WebP (изображения), MP3 (аудио), PDF, FB2 (документы)."
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "Допустимые форматы — JPEG, PNG, WebP, MP3, PDF, FB2. Другие форматы будут отклонены."
      responses:
        '200':
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IFileResponseDto'
      tags:
        - Files
      security:
        - bearer: []
    get:
      operationId: getFiles
      summary: List image files
      description: "Returns a list of all image files in storage (for cover reuse feature)"
      tags:
        - files
      responses:
        '200':
          description: List of image files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllFilesResponse'
  /files/{fileName}/stream-url:
    get:
      operationId: AppController_getStreamUrl
      summary: Получить URL потока для файла
      parameters:
        - name: fileName
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: 'Предварительно подписанный URL потока'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamUrlResponse'
      tags:
        - Files
  /files/{fileName}:
    get:
      operationId: AppController_getFile
      summary: Получить публичный URL файла
      parameters:
        - name: fileName
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Информация о файле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IFileResponseDto'
      tags:
        - Files
  /health:
    get:
      operationId: HealthController_check
      summary: Проверить состояние сервиса
      parameters: []
      responses:
        '200':
          description: 'Состояние сервиса'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /section:
    post:
      operationId: SectionController_create
      summary: Создать раздел
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionDto'
      responses:
        '200':
          description: Раздел создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
      security:
        - bearer: []
    get:
      operationId: SectionController_findAll
      summary: Получить все разделы
      parameters: []
      responses:
        '200':
          description: Список разделов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSectionsResponse'
      tags:
        - Sections
  /section/reorder:
    patch:
      operationId: reorderSections
      summary: Изменить порядок разделов
      description: Принимает список id разделов в новом порядке и обновляет позиции
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSectionsDto'
      responses:
        '200':
          description: Порядок разделов обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSectionsResponse'
      tags:
        - section
      security:
        - bearer: []
  /section/{id}:
    get:
      operationId: SectionController_findOne
      summary: Получить раздел по ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Раздел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
    patch:
      operationId: SectionController_update
      summary: "Обновить раздел (включая связанные плейлисты)"
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionDto'
      responses:
        '200':
          description: Раздел обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEntity'
      tags:
        - Sections
      security:
        - bearer: []
    delete:
      operationId: SectionController_remove
      summary: Удалить раздел
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Раздел удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSectionsResponse'
      tags:
        - Sections
      security:
        - bearer: []
  /section/{id}/playlists/reorder:
    patch:
      operationId: reorderPlaylistsInSection
      summary: Изменить порядок плейлистов в разделе
      description: Принимает список id плейлистов в новом порядке и обновляет их позиции внутри раздела
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPlaylistsDto'
      responses:
        '200':
          description: Порядок плейлистов в разделе обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSectionsResponse'
      tags:
        - section
      security:
        - bearer: []
  /playlists:
    post:
      operationId: PlaylistController_create
      summary: Создать плейлист
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistDto'
      responses:
        '200':
          description: Плейлист создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
      security:
        - bearer: []
    get:
      operationId: PlaylistController_findAll
      summary: Получить все плейлисты
      parameters: []
      responses:
        '200':
          description: Список плейлистов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllPlaylistsResponse'
      tags:
        - Playlists
  /playlists/{id}:
    get:
      operationId: PlaylistController_findOne
      summary: "Получить плейлист по ID (с проповедями)"
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Плейлист
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
    patch:
      operationId: PlaylistController_update
      summary: Обновить плейлист
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistDto'
      responses:
        '200':
          description: Плейлист обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEntity'
      tags:
        - Playlists
      security:
        - bearer: []
    delete:
      operationId: PlaylistController_remove
      summary: Удалить плейлист
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Плейлист удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPlaylistResponse'
      tags:
        - Playlists
      security:
        - bearer: []
  /playlists/{id}/sermons/reorder:
    patch:
      operationId: reorderSermonsInPlaylist
      summary: Изменить порядок проповедей в плейлисте
      description: Принимает список id проповедей в новом порядке и обновляет их позиции внутри плейлиста
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSermonsDto'
      responses:
        '200':
          description: Порядок проповедей в плейлисте обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPlaylistResponse'
      tags:
        - playlists
      security:
        - bearer: []
  /sermons:
    post:
      operationId: SermonController_create
      summary: Создать новую проповедь
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSermonDto'
      responses:
        '200':
          description: Проповедь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermonEntity'
      tags:
        - Sermons
      security:
        - bearer: []
    get:
      operationId: SermonController_findAll
      summary: Получить список всех проповедей
      parameters:
        - name: take
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          required: false
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          required: false
          in: query
          description: Поисковый запрос по названию, проповеднику, книге и описанию
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Список проповедей с количеством
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSermonsResponse'
      tags:
        - Sermons
  /sermons/{id}/stream-url:
    get:
      operationId: SermonController_getStreamUrl
      summary: Получить URL потока для аудио проповеди
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Предварительно подписанный URL потока'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamUrlResponse'
      tags:
        - Sermons
  /sermons/{id}:
    get:
      operationId: SermonController_findOne
      summary: Получить одну проповедь по ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Проповедь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SermonEntity'
      tags:
        - Sermons
    patch:
      operationId: SermonController_update
      summary: Обновить проповедь
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSermonDto'
      responses:
        '200':
          description: Проповедь обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSermonResponse'
      tags:
        - Sermons
      security:
        - bearer: []
    delete:
      operationId: SermonController_remove
      summary: Удалить проповедь
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Проповедь удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSermonResponse'
      tags:
        - Sermons
      security:
        - bearer: []
  /auth/login:
    post:
      operationId: AuthController_signIn
      summary: Вход в админ-панель
      description: Возвращает JWT токен для дальнейших запросов
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequestDto'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Обновить access и refresh токены
      description: Принимает refresh токен и возвращает новую пару токенов
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
      tags:
        - Auth
  /auth/profile:
    get:
      operationId: AuthController_getProfile
      summary: Получить профиль текущего пользователя
      parameters: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      tags:
        - Auth
      security:
        - bearer: []
  /users:
    get:
      tags:
        - Users
      operationId: UsersController_findAll
      security:
        - bearer: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      tags:
        - Users
      operationId: UsersController_create
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /users/{id}:
    get:
      tags:
        - Users
      operationId: UsersController_findOne
      security:
        - bearer: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags:
        - Users
      operationId: UsersController_update
      security:
        - bearer: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags:
        - Users
      operationId: UsersController_remove
      security:
        - bearer: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Пользователь удалён
  /users/{id}/password:
    patch:
      tags:
        - Users
      operationId: UsersController_changePassword
      security:
        - bearer: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT токен, полученный после успешного логина
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    StreamUrlResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url
    IFileResponseDto:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
        fileUrl:
          type: string
      required:
        - fileName
        - fileUrl
    FileMetadataDto:
      type: object
      properties:
        fileName:
          type: string
        fileUrl:
          type: string
        size:
          type: integer
          format: int64
          nullable: true
        lastModified:
          type: string
          format: date-time
          nullable: true
      required:
        - fileName
        - fileUrl
        - size
        - lastModified

    AllFilesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadataDto'
        count:
          type: integer
      required:
        - files
        - count
    CreateSectionDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        itemsSize:
          type: string
          enum:
            - small
            - middle
            - large
            - xLarge
        itemsRows:
          type: number
          nullable: true
        transform:
          type: string
          enum:
            - high
            - middle
            - short
        isDescriptionTitleOnSlideLarge:
          type: boolean
        whereIsSlideTitleLocated:
          type: string
          enum:
            - 'on'
            - under
            - bothOnAndUnder
        borderRadius:
          type: boolean
      required:
        - title
        - itemsSize
        - transform
        - description
        - itemsRows
    SectionEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        # Global order of sections (drag-and-drop reordering).
        position:
          type: integer
        itemsSize:
          type: string
          enum:
            - small
            - middle
            - large
            - xLarge
        itemsRows:
          type: number
          nullable: true
        transform:
          type: string
          enum:
            - high
            - middle
            - short
        isDescriptionTitleOnSlideLarge:
          type: boolean
          default: false
        whereIsSlideTitleLocated:
          type: string
          enum:
            - 'on'
            - under
            - bothOnAndUnder
          default: under
        borderRadius:
          type: boolean
          default: false
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/SectionPlaylist'
      required:
        - id
        - title
        - description
        - itemsSize
        - itemsRows
        - transform
        - playlists
        - position
    SectionRef:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id
        - title
    SectionPlaylist:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        artwork:
          type: string
        # Position of this playlist within the section that references it.
        position:
          type: integer
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionRef'
        sermons:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistSermon'
      required:
        - id
        - title
        - description
        - artwork
        - sections
        - sermons
        - position
    SermonEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        textFileUrl:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        youtubeUrl:
          type: string
          nullable: true
        artist:
          type: string
        artwork:
          type: string
        book:
          type: string
          nullable: true
        chapter:
          type: number
          nullable: true
        verse:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
          nullable: true
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistEntity'
      required:
        - id
        - title
        - description
        - textFileUrl
        - audioUrl
        - youtubeUrl
        - artist
        - artwork
        - book
        - chapter
        - verse
        - playlists
    PlaylistSermon:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        textFileUrl:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        youtubeUrl:
          type: string
          nullable: true
        artist:
          type: string
        artwork:
          type: string
        book:
          type: string
          nullable: true
        chapter:
          type: integer
          nullable: true
        verse:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
          nullable: true
        # Position of this sermon within the playlist that references it.
        position:
          type: integer
        playlists:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              title:
                type: string
            required:
              - id
              - title
      required:
        - id
        - title
        - description
        - textFileUrl
        - audioUrl
        - youtubeUrl
        - artist
        - artwork
        - book
        - chapter
        - verse
        - position
        - playlists
    PlaylistEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
