# Standalone Swagger UI + OpenAPI spec service
# Serves static files from /usr/share/nginx/html on port 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Compression for text-based assets
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/yaml
        application/xml
        application/json
        application/javascript
        application/x-yaml
        image/svg+xml;

    # ------------------------------------------------------------------
    # CORS — allow the frontend/mobile codegen to fetch the spec
    # ------------------------------------------------------------------
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
    add_header Access-Control-Expose-Headers "Content-Type" always;
    add_header Access-Control-Max-Age "86400" always;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:3000 https://api.slovo-propovedi.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Short-circuit CORS preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ------------------------------------------------------------------
    # OpenAPI spec with an explicit YAML content type
    # (scoped types map so the default mime.types stay untouched)
    # ------------------------------------------------------------------
    location = /openAPI.yaml {
        types {
            text/yaml yaml yml;
        }
        default_type text/yaml;
        try_files $uri =404;
    }

    # Cache immutable static assets
    location ~* \.(?:js|css|png|svg|ico)$ {
        expires 1d;
        access_log off;
    }

    # Never expose hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }

    # SPA-like fallback for anything else
    location / {
        try_files $uri $uri/ /index.html;
    }
}
